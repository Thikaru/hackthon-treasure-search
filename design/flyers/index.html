<body>
<div id="out"></div>
<script type="module">
import { chestSvg, treasureSvg, mapChestSvg } from '../../src/art/svgArt.js'
import { QR_SVG } from './qr.js'

// =====================================================================
// 手書き風の文字（レタリング）
// 字形の元にフォントを使うが、1文字ずつ傾け・大きさを変え、太い縁取り・影・
// 線のゆらぎ（にじみ）を重ねて「描いた文字」に見せる。一部の字は絵に置き換える。
// =====================================================================
let seed = 7
const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280)
const jit = (a) => (rnd() * 2 - 1) * a
let uid = 0

// 絵に置き換える文字
const GLYPHS = {
  // 「の」を、波がくるっと巻いた形に
  wave: (s) => `<path d="M ${0.2 * s} ${-0.02 * s} C ${0.26 * s} ${-0.36 * s} ${-0.34 * s} ${-0.4 * s} ${-0.34 * s} ${0.02 * s} C ${-0.34 * s} ${0.32 * s} ${0.02 * s} ${0.38 * s} ${0.24 * s} ${0.16 * s} C ${0.4 * s} ${0} ${0.3 * s} ${-0.3 * s} ${0.04 * s} ${-0.34 * s} M ${0.02 * s} ${-0.3 * s} C ${-0.06 * s} ${-0.05 * s} ${-0.1 * s} ${0.15 * s} ${-0.22 * s} ${0.26 * s}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
  // 「×」を、交差した2本の鍵の形に
  keys: (s) => `<path d="M ${-0.3 * s} ${-0.3 * s} L ${0.3 * s} ${0.3 * s} M ${0.3 * s} ${-0.3 * s} L ${-0.3 * s} ${0.3 * s}" fill="none" stroke-linecap="round"/>`,
}

/**
 * chars: 文字の配列（{g:'wave'} で絵の字）
 * o: { x, y, size, gap, rot, font, fill:[上,下], edge, outline, white, shadow, rough, stroke }
 */
function lettering(chars, o) {
  const id = 'L' + uid++
  const size = o.size, gap = o.gap ?? 0.94
  const outW = o.outW ?? size * 0.2, whiteW = o.whiteW ?? size * 0.11
  const items = [...chars].map((c, i) => {
    const r = jit(o.rot ?? 5), sc = 1 + jit(o.scale ?? 0.05), dy = jit(o.dy ?? size * 0.04)
    const cx = (o.vertical ? 0 : i * size * gap), cy = (o.vertical ? i * size * gap : 0) + dy
    return { c, r, sc, cx, cy }
  })
  const glyph = (it, layer) => {
    const t = `translate(${it.cx} ${it.cy}) rotate(${it.r}) scale(${it.sc})`
    if (typeof it.c === 'object') {
      const strokeW = { shadow: size * 0.13 + outW, out: size * 0.13 + outW, white: size * 0.13 + whiteW, fill: size * 0.13 }[layer]
      // 絵の字は線で描くので、中の色の層では線の色を塗りの色にする
      return `<g transform="${t}" stroke-width="${strokeW}"${layer === 'fill' ? ` stroke="url(#${id}g)"` : ''}>${GLYPHS[it.c.g](size)}</g>`
    }
    return `<text transform="${t}" text-anchor="middle" dominant-baseline="central" font-family="${o.font ?? "'Zen Maru Gothic'"}" font-weight="900" font-size="${size}">${it.c}</text>`
  }
  const layer = (name, attrs) => `<g ${attrs}>${items.map((it) => glyph(it, name)).join('')}</g>`
  const rough = o.rough ?? 3
  return `<g transform="translate(${o.x} ${o.y})">
    <defs>
      <linearGradient id="${id}g" x1="0" y1="${-size / 2}" x2="0" y2="${size / 2}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${o.fill[0]}"/><stop offset="1" stop-color="${o.fill[1]}"/></linearGradient>
      <filter id="${id}r" x="-20%" y="-40%" width="140%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="${o.freq ?? 0.035}" numOctaves="2" seed="${uid}"/><feDisplacementMap in="SourceGraphic" scale="${rough}"/></filter>
    </defs>
    <g filter="url(#${id}r)">
      ${o.shadow !== false ? layer('shadow', `fill="${o.shadowColor ?? o.outline}" stroke="${o.shadowColor ?? o.outline}" stroke-width="${outW}" stroke-linejoin="round" transform="translate(${size * 0.06} ${size * 0.08})" opacity="${o.shadowOpacity ?? 1}"`) : ''}
      ${layer('out', `fill="${o.outline}" stroke="${o.outline}" stroke-width="${outW}" stroke-linejoin="round"`)}
      ${o.white !== false ? layer('white', `fill="${o.white ?? '#fff'}" stroke="${o.white ?? '#fff'}" stroke-width="${whiteW}" stroke-linejoin="round"`) : ''}
      ${layer('fill', `fill="url(#${id}g)" stroke="${o.edge ?? 'url(#' + id + 'g)'}" stroke-width="${size * 0.03}" stroke-linejoin="round"`)}
      ${o.shine !== false ? `<g opacity=".55" clip-path="none">${items.map((it) => typeof it.c === 'object' ? '' : `<text transform="translate(${it.cx - size * 0.03} ${it.cy - size * 0.04}) rotate(${it.r}) scale(${it.sc})" text-anchor="middle" dominant-baseline="central" font-family="${o.font ?? "'Zen Maru Gothic'"}" font-weight="900" font-size="${size}" fill="none" stroke="#fff" stroke-width="${size * 0.018}" stroke-dasharray="${size * 0.25} ${size * 0.6}"/>`).join('')}</g>` : ''}
    </g>
  </g>`
}

const place = (svg, x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})">${svg}</g>`

// ---------------------------------------------------------------- 絵の部品
function seagull(x, y, s = 1, hat = '#1f4fb8') {
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="120" rx="80" ry="16" fill="rgba(0,0,0,.18)"/>
    <path d="M-70 40 Q-80 -40 0 -50 Q80 -40 70 40 Q60 110 0 115 Q-60 110 -70 40Z" fill="#fff" stroke="#2a3550" stroke-width="6"/>
    <path d="M-62 30 Q-110 0 -120 40 Q-90 50 -66 60Z" fill="#9a6232" stroke="#2a3550" stroke-width="6" stroke-linejoin="round"/>
    <path d="M60 20 Q118 -20 128 18 Q100 40 64 52Z" fill="#9a6232" stroke="#2a3550" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="-22" cy="-6" r="9" fill="#2a3550"/><circle cx="22" cy="-6" r="9" fill="#2a3550"/>
    <circle cx="-19" cy="-9" r="3" fill="#fff"/><circle cx="25" cy="-9" r="3" fill="#fff"/>
    <path d="M-16 12 L16 12 L0 34Z" fill="#ffb21a" stroke="#2a3550" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="-42" cy="18" rx="10" ry="6" fill="#ffb3b3" opacity=".8"/><ellipse cx="42" cy="18" rx="10" ry="6" fill="#ffb3b3" opacity=".8"/>
    <path d="M-50 -46 Q0 -96 50 -46 Z" fill="${hat}" stroke="#2a3550" stroke-width="6" stroke-linejoin="round"/>
    <rect x="-60" y="-52" width="120" height="16" rx="8" fill="#fff" stroke="#2a3550" stroke-width="6"/>
    <path d="M-10 -78 l10 -8 l10 8" fill="none" stroke="#ffd36b" stroke-width="5" stroke-linecap="round"/>
    <path d="M-30 112 l-6 18 M-14 114 l-2 18 M14 114 l2 18 M30 112 l6 18" stroke="#ffb21a" stroke-width="7" stroke-linecap="round"/>
  </g>`
}

function bubble(x, y, w, h, text, tail = 'left') {
  const tx = tail === 'left' ? 40 : w - 60
  return `<g transform="translate(${x} ${y})">
    <path d="M24 0 H${w - 24} Q${w} 0 ${w} 24 V${h - 24} Q${w} ${h} ${w - 24} ${h} H${tx + 40} L${tx + 10} ${h + 34} L${tx + 10} ${h} H24 Q0 ${h} 0 ${h - 24} V24 Q0 0 24 0Z" fill="#fff" stroke="#2a3550" stroke-width="6" stroke-linejoin="round"/>
    <text x="${w / 2}" y="${h / 2}" text-anchor="middle" dominant-baseline="central" font-family="'Yusei Magic'" font-size="34" fill="#2a3550">${text}</text>
  </g>`
}

function bridge(x, y, w, color, lights) {
  const t1 = x + w * 0.28, t2 = x + w * 0.72, top = y - 150
  const lamp = lights ? Array.from({ length: 26 }, (_, i) => `<circle cx="${x + (w * i) / 25}" cy="${y + 2}" r="3.5" fill="#ffd27a"/>`).join('') : ''
  return `<g stroke="${color}" fill="none" stroke-linecap="round">
    <path d="M${x} ${y} H${x + w}" stroke-width="10"/>
    ${[t1, t2].map((t) => `<path d="M${t - 14} ${y + 30} V${top} M${t + 14} ${y + 30} V${top} M${t - 14} ${top + 30} H${t + 14} M${t - 14} ${top + 90} H${t + 14}" stroke-width="8"/>`).join('')}
    <path d="M${x} ${y - 10} Q${(x + t1) / 2} ${y - 40} ${t1} ${top + 4} Q${(t1 + t2) / 2} ${y - 20} ${t2} ${top + 4} Q${(t2 + x + w) / 2} ${y - 40} ${x + w} ${y - 10}" stroke-width="4"/>
    ${lamp}
  </g>`
}

function rays(cx, cy, r, color, n = 28, op = 0.35) {
  return `<g opacity="${op}">${Array.from({ length: n }, (_, i) => {
    const a = (i / n) * Math.PI * 2, b = a + Math.PI / n * 0.8
    return `<path d="M${cx} ${cy} L${cx + Math.cos(a) * r} ${cy + Math.sin(a) * r} L${cx + Math.cos(b) * r} ${cy + Math.sin(b) * r}Z" fill="${color}"/>`
  }).join('')}</g>`
}

function sparkle(x, y, s, c = '#fff') {
  return `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -20 Q2 -2 20 0 Q2 2 0 20 Q-2 2 -20 0 Q-2 -2 0 -20Z" fill="${c}"/>`
}

function qr(x, y, size) {
  return `<g transform="translate(${x} ${y})"><rect x="-14" y="-14" width="${size + 28}" height="${size + 28}" rx="16" fill="#fff"/><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${QR_SVG.replace('<svg', `<svg width="${size}" height="${size}"`)}</svg></g>`
}

// 情報欄（細かい文字はフォント）
function infoBlock(y, theme) {
  const ink = theme.ink, sub = theme.sub, box = theme.box, acc = theme.acc
  return `<g transform="translate(0 ${y})">
    <rect x="50" y="0" width="1140" height="300" rx="28" fill="${box}" stroke="${theme.boxLine}" stroke-width="4"/>
    <g font-family="'Noto Sans JP'" fill="${ink}">
      <rect x="86" y="36" width="150" height="46" rx="10" fill="${acc}"/>
      <text x="161" y="67" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">受付時間</text>
      <text x="256" y="72" font-size="44" font-weight="900">9:30〜15:30</text>
      <text x="560" y="70" font-size="22" font-weight="700" fill="${sub}">（ゴール受付は16:00まで）</text>
      <rect x="86" y="104" width="150" height="46" rx="10" fill="${acc}"/>
      <text x="161" y="135" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">受付場所</text>
      <text x="256" y="139" font-size="34" font-weight="900">渋川海岸 パークセンター</text>
      <rect x="86" y="172" width="150" height="46" rx="10" fill="${acc}"/>
      <text x="161" y="203" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">あそびかた</text>
      <text x="256" y="196" font-size="24" font-weight="700">スマホで右のQRを読み、謎を解いて浜のお宝を探そう。</text>
      <text x="256" y="230" font-size="24" font-weight="700">お宝を6個集めると、受付で記念品と交換できます。</text>
      <text x="86" y="276" font-size="19" font-weight="500" fill="${sub}">※ 日時・景品などは仮の内容です。 ※ 満潮の時間帯は波打ち際に近づかないでください。</text>
    </g>
    ${qr(935, 40, 190)}
    <text x="1030" y="292" text-anchor="middle" font-family="'Noto Sans JP'" font-size="18" font-weight="700" fill="${sub}">aipapagames.com/shibukawa</text>
  </g>`
}

// 日付（手書き風）
function dateBlock(x, y, c) {
  const S = 104, G = 0.8, step = S * G
  const d1 = ['1', '1', '/', '3'], d2 = ['1', '1', '/', '2', '9']
  const end1 = x + S * 0.3 + (d1.length - 1) * step + S * 0.5
  const a0 = end1 + 52, a1 = a0 + 60
  const x2 = a1 + 40
  const end2 = x2 + S * 0.3 + (d2.length - 1) * step + S * 0.5
  const L = (chars, xx, yy, o) => lettering(chars, { x: xx, y: yy, rot: 3, fill: [c.fill1, c.fill2], outline: c.out, rough: 2.5, font: "'Dela Gothic One'", ...o })
  const wd = (txt, xx) => lettering([...txt], { x: xx, y: y + 70, size: 30, gap: 0.95, vertical: true, rot: 0, fill: [c.out, c.out], outline: '#fff', outW: 7, white: false, shadow: false, shine: false, rough: 1, font: "'Dela Gothic One'" })
  return `<g>
    ${L(['2', '0', '2', '6', '.'], x + 4, y + 4, { size: 54, gap: 0.82, outW: 8, whiteW: 4 })}
    ${L(d1, x + S * 0.3, y + 104, { size: S, gap: G, outW: 15, whiteW: 8 })}
    ${wd('TUE', end1 + 20)}
    <path d="M${a0} ${y + 104} h60 m-22 -22 l22 22 l-22 22" fill="none" stroke="${c.out}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    ${L(d2, x2 + S * 0.3, y + 104, { size: S, gap: G, outW: 15, whiteW: 8 })}
    ${wd('SUN', end2 + 20)}
  </g>`
}

// 「参加無料」のリボン
function ribbon(x, y, w, color, text, c2) {
  return `<g transform="translate(${x} ${y}) rotate(-3)">
    <path d="M0 0 H${w} L${w - 26} 40 L${w} 80 H0 L26 40Z" fill="${color}" stroke="${c2}" stroke-width="6" stroke-linejoin="round"/>
    ${lettering([...text], { x: 70, y: 40, size: 50, gap: 1.0, rot: 3, fill: ['#fff', '#fff6d8'], outline: c2, outW: 8, whiteW: 0.1, white: false, rough: 1.5, shine: false })}
  </g>`
}


// =====================================================================
// 渋川の地図のイラスト（宝箱の代わりに置く）。地図の中の座標は 560×380
// 左下が海（瀬戸内海）、右上が陸。北西から南東へ斜めに砂浜がのびる
// =====================================================================
const MW = 560, MH = 380
const COAST = 'M-10 118 Q150 140 260 214 T570 332'
const SPOTS_MAP = [[72, 112, '01'], [150, 140, '02'], [236, 190, '03'], [362, 246, '04'], [462, 284, '05']]
const PINES = [[60, 40], [110, 30], [170, 55], [230, 70], [290, 95], [80, 75], [140, 85], [210, 110], [480, 150], [520, 180], [400, 110], [440, 90], [500, 120]]

function shibukawaMap(p, st) {
  const pine = ([x, y]) => `<path d="M${x} ${y - 16} l11 16 h-22Z M${x} ${y - 24} l8 12 h-16Z" fill="${st.pine}" stroke="${st.pineLine}" stroke-width="1.5" stroke-linejoin="round"/>`
  const spot = ([x, y, no]) => st.pins === 'x'
    ? `<g transform="translate(${x} ${y})"><path d="M-12 -12 L12 12 M12 -12 L-12 12" stroke="${st.x}" stroke-width="7" stroke-linecap="round"/><circle cx="18" cy="-20" r="13" fill="${st.paper}" stroke="${st.ink}" stroke-width="2.5"/><text x="18" y="-19" text-anchor="middle" dominant-baseline="central" font-family="'Dela Gothic One'" font-size="12" fill="${st.ink}">${no}</text></g>`
    : `<g transform="translate(${x - 17} ${y - 32}) scale(.64)">${mapChestSvg(no, no === '01' || no === '03')}</g>`
  return `<g>
    <defs><clipPath id="${p}c"><rect width="${MW}" height="${MH}" rx="${st.rx ?? 6}"/></clipPath></defs>
    <g clip-path="url(#${p}c)">
      <rect width="${MW}" height="${MH}" fill="${st.land}"/>
      ${st.texture ? `<rect width="${MW}" height="${MH}" fill="#fff" filter="url(#${p}tex)" opacity=".9"/>` : ''}
      <!-- 公園と建物 -->
      <rect x="300" y="30" width="120" height="62" rx="8" fill="${st.park}" stroke="${st.parkLine}" stroke-width="2"/>
      <text x="360" y="62" text-anchor="middle" dominant-baseline="central" font-family="'Yusei Magic'" font-size="15" fill="${st.ink}">渋川公園</text>
      ${[[455, 40], [495, 58], [520, 30]].map(([x, y]) => `<rect x="${x}" y="${y}" width="26" height="18" rx="3" fill="${st.house}" stroke="${st.parkLine}" stroke-width="1.5"/>`).join('')}
      <!-- 国道430号 -->
      <path d="M-10 60 Q190 82 320 140 T570 236" fill="none" stroke="${st.roadEdge}" stroke-width="16" stroke-linecap="round"/>
      <path d="M-10 60 Q190 82 320 140 T570 236" fill="none" stroke="${st.road}" stroke-width="10" stroke-linecap="round"/>
      ${PINES.map(pine).join('')}
      <!-- 海と砂浜 -->
      <path d="${COAST} L570 400 L-10 400Z" fill="${st.sea}"/>
      <path d="${COAST}" fill="none" stroke="${st.sand}" stroke-width="40" transform="translate(-6 -18)"/>
      <path d="${COAST}" fill="none" stroke="${st.surf}" stroke-width="5" stroke-linecap="round"/>
      ${Array.from({ length: 8 }, (_, i) => `<path d="M${30 + (i % 4) * 130} ${250 + Math.floor(i / 4) * 60 + (i % 2) * 14} q12 -7 24 0 t24 0" fill="none" stroke="${st.wave}" stroke-width="3" stroke-linecap="round"/>`).join('')}
      <text x="110" y="300" font-family="'Yusei Magic'" font-size="26" fill="${st.seaText}" transform="rotate(-8 110 300)">瀬戸内海</text>
      <!-- 歩く道と宝の場所 -->
      <path d="M430 168 Q330 172 250 150 Q160 125 72 112 Q110 150 236 190 Q300 222 362 246 Q420 268 462 284" fill="none" stroke="${st.route}" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>
      ${SPOTS_MAP.map(spot).join('')}
      <g transform="translate(430 168)"><circle r="15" fill="${st.start}" stroke="#fff" stroke-width="3"/><text y="1" text-anchor="middle" dominant-baseline="central" font-family="'Dela Gothic One'" font-size="13" fill="#fff">S</text></g>
      <text x="452" y="174" font-family="'Yusei Magic'" font-size="15" fill="${st.ink}">受付</text>
      <text x="300" y="232" font-family="'Yusei Magic'" font-size="16" fill="${st.ink}" transform="rotate(25 300 232)">渋川海岸</text>
      <!-- 方位 -->
      <g transform="translate(${MW - 46} ${MH - 50})"><circle r="26" fill="${st.paper}" stroke="${st.ink}" stroke-width="2"/><path d="M0 -30 L6 0 L0 30 L-6 0Z" fill="${st.x}"/><path d="M-30 0 L0 6 L30 0 L0 -6Z" fill="${st.ink}"/><text y="-34" text-anchor="middle" font-family="'Dela Gothic One'" font-size="13" fill="${st.ink}">N</text></g>
    </g>
    <defs><filter id="${p}tex"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="4" seed="5"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .15  0 0 0 .25 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs>
  </g>`
}

const PARCH = { land: '#f4e2b8', paper: '#fbefd2', park: '#cfe0a8', parkLine: '#8a6a3a', house: '#e8cfa0', road: '#ead2a0', roadEdge: '#b08a50', pine: '#7a9a5a', pineLine: '#4a5a2a', sea: '#9cc4c8', sand: '#f0d9a0', surf: '#fff8e8', wave: '#5f8f96', seaText: '#3f6f76', route: '#b8402a', x: '#c8341e', ink: '#5a3a1a', start: '#2a8a6a', pins: 'x', texture: true }
const MODERN = { land: '#eaf3e1', paper: '#ffffff', park: '#c6e8b8', parkLine: '#8fb88a', house: '#e2e6ea', road: '#ffffff', roadEdge: '#c9d3dc', pine: '#5aa86a', pineLine: '#3a7a4a', sea: '#8fd3f0', sand: '#f6e4bc', surf: '#ffffff', wave: '#ffffff', seaText: '#2f78b0', route: '#ff7a1a', x: '#d9472b', ink: '#3a4a5a', start: '#1f4fb8', pins: 'chest', rx: 14 }

// 地図の見せ方：巻物（羊皮紙）
function mapScroll(x, y) {
  const w = MW, h = MH
  const roll = (rx) => `<g><rect x="${rx - 18}" y="-26" width="36" height="${h + 52}" rx="18" fill="url(#scRoll)" stroke="#6e4422" stroke-width="4"/><ellipse cx="${rx}" cy="-26" rx="18" ry="8" fill="#c99a5a" stroke="#6e4422" stroke-width="4"/><circle cx="${rx}" cy="${h + 34}" r="10" fill="#b8402a" stroke="#6e4422" stroke-width="3"/><path d="M${rx} ${h + 30} q-10 26 -4 44 M${rx} ${h + 30} q8 24 14 40" stroke="#b8402a" stroke-width="5" fill="none" stroke-linecap="round"/></g>`
  return `<g transform="translate(${x} ${y}) rotate(-4)">
    <defs><linearGradient id="scRoll" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a06e3a"/><stop offset=".45" stop-color="#f0d9a0"/><stop offset="1" stop-color="#8a5a2a"/></linearGradient></defs>
    <ellipse cx="${w / 2}" cy="${h + 52}" rx="${w * 0.55}" ry="16" fill="rgba(0,0,0,.22)"/>
    <rect x="-6" y="-6" width="${w + 12}" height="${h + 12}" fill="#e8cf98" stroke="#8a6a3a" stroke-width="4"/>
    ${shibukawaMap('sc', PARCH)}
    ${roll(-14)}${roll(w + 14)}
  </g>`
}

// 地図の見せ方：テープで貼った地図カード（スマホの地図アプリ風）
function mapCard(x, y) {
  const w = MW, h = MH
  return `<g transform="translate(${x} ${y}) rotate(-3)">
    <rect x="-18" y="-18" width="${w + 36}" height="${h + 70}" rx="22" fill="#fff" stroke="#2a3550" stroke-width="5"/>
    <rect x="-18" y="-18" width="${w + 36}" height="${h + 70}" rx="22" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="14" transform="translate(6 8)" opacity=".5"/>

// 地図の見せ方：模型（ジオラマ）。斜めから見下ろした板の上に、立った宝箱
function mapDiorama(x, y) {
  const w = MW, h = MH, k = 0.58, sk = Math.tan((-24 * Math.PI) / 180)
  const P = (px, py) => [px + py * k * sk, py * k] // 地図の点 → 板の上の点
  const chests = SPOTS_MAP.map(([px, py, no]) => { const [qx, qy] = P(px, py); return `<g transform="translate(${qx - 26} ${qy - 52})">${mapChestSvg(no, no === '01' || no === '03')}</g>` }).join('')
  const [sx, sy] = P(430, 168)
  const flag = `<g transform="translate(${sx} ${sy})"><path d="M0 0 V-60" stroke="#6e4422" stroke-width="5"/><path d="M0 -60 l40 12 l-40 12Z" fill="#2a8a6a" stroke="#123a2a" stroke-width="3"/><text x="16" y="-44" font-family="'Dela Gothic One'" font-size="12" fill="#fff">S</text></g>`
  return `<g transform="translate(${x + 110} ${y + 70})">
    <ellipse cx="${w / 2 - 70}" cy="${h * k + 70}" rx="${w * 0.62}" ry="26" fill="rgba(0,0,0,.25)"/>
    <g transform="skewX(-24) scale(1 ${k})">
      <rect x="0" y="${h}" width="${w}" height="70" fill="#8a5a34"/>
      <rect x="0" y="${h}" width="${w}" height="22" fill="#e2bd82"/>
      <rect x="0" y="${h + 22}" width="${w}" height="10" fill="#b8874a"/>
      ${shibukawaMap('dr', { ...MODERN, pins: 'none', rx: 4 }).replace(/<g transform="translate\([^)]*\) scale\(\.64\)">[\s\S]*?<\/svg><\/g>/g, '')}
    </g>

  </g>`
}

// 案A のタイトル。tv=0 は元のまま、1〜3 は読みやすくした微調整
function titleA(tv) {
  const base1 = { x: 140, y: 360, size: 168, gap: 0.92, rot: 6, fill: ['#ffffff', '#bfe6ff'], outline: '#16336b', outW: 34, whiteW: 18, rough: 4 }
  const base2 = { x: 210, y: 590, size: 290, gap: 0.98, rot: 5, fill: ['#ffe680', '#f29a1f'], outline: '#6e2a0c', outW: 46, whiteW: 24, rough: 5 }
  const t1 = ['渋', '川', 'か', 'ら', { g: 'wave' }], t2 = ['挑', '戦', '状']
  // 1：線のゆらぎを弱め、字の間を少し空け、光の点線を消す（形はほぼそのまま）
  const v1a = { ...base1, rough: 2, gap: 0.97, x: 128, shine: false }, v1b = { ...base2, rough: 2.5, gap: 1.02, x: 196, shine: false }
  // 2：1 に加えて、字の中の色を濃くして白い縁との差をはっきり（渋川からの＝空色、挑戦状＝濃いオレンジ）
  const v2a = { ...v1a, fill: ['#e8f6ff', '#7cc2f5'], edge: '#16336b' }, v2b = { ...v1b, fill: ['#ffd84a', '#ee7a12'], edge: '#6e2a0c' }
  // 3：1 に加えて、傾きを小さくして字の並びをそろえ、縁取りを少し細くして字の形を見やすく
  const v3a = { ...v1a, rot: 2.5, scale: 0.02, dy: 4, outW: 28, whiteW: 14 }, v3b = { ...v1b, rot: 2.5, scale: 0.02, dy: 6, outW: 40, whiteW: 20 }
  // 4（決定版）：案2 をもとに、字の間をさらに空けて「か」「ら」が重ならないように。「の」は普通の文字
  const v4a = { ...v2a, gap: 1.06, rot: 4, x: 118, size: 162 }
  const pick = [[base1, base2], [v1a, v1b], [v2a, v2b], [v3a, v3b], [v4a, v2b]][tv]
  seed = 11
  if (tv === 4) {
    // 漢字（渋川）は大きく、ひらがな（からの）は小さく詰めて、下をそろえる
    const k = { ...v2a, size: 166, gap: 1.0, x: 124 }
    const kanaSize = 132
    const kana = { ...v2a, size: kanaSize, gap: 0.9, x: k.x + k.size * k.gap * 2 - k.size * 0.5 + kanaSize * 0.5 - 6, y: k.y + (k.size - kanaSize) / 2 - 14, outW: 28, whiteW: 15 }
    return lettering(['渋', '川'], k) + lettering(['か', 'ら', 'の'], kana) + lettering(t2, pick[1])
  }
  return lettering(t1, pick[0]) + lettering(t2, pick[1])
}
